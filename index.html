function buildCityIndex(){
  const MUNI=new Set(["北京","上海","天津","重庆"]),g={};
  const add=(key,prov,u)=>{const o=g[key]=g[key]||{n:key,p:prov,sx:0,sy:0,cnt:0,isCity:true};
    o.cnt++;o.sx+=u.ll[0];o.sy+=u.ll[1];};
  for(const u of UNIS.concat(DOTS)){
    if(!u.ll||!u.ll[0])continue;
    const c=u.c||u.p;if(c)add(c,u.p,u);
    // 直辖市的 c 多为区(海淀区/宝山区),额外按"北京市/上海市/天津市/重庆市"整体聚合
    const pb=String(u.p||"").replace(/[省市]$/,"");
    if(MUNI.has(pb)){const canon=pb+"市";if(c!==canon)add(canon,u.p,u);}
  }
  CITYIDX=Object.values(g).map(o=>({n:o.n,p:o.p,cnt:o.cnt,isCity:true,
    ll:[o.sx/o.cnt,o.sy/o.cnt]})).sort((a,b)=>b.cnt-a.cnt);

// 视口裁剪(LOD):放大到某省时只挂载视野内的旗子,屏外的卸载——大幅减少每帧 DOM 重投影压力。
// 屏幕空间判定(map.project),天然兼容俯仰/旋转;留 PAD 像素边距,平移不闪。
const CULL_PAD=200;
function cullMarkers(){
  const z=map.getZoom(),W=innerWidth,H=innerHeight,
        recMode=document.body.classList.contains("rec-mode"),all=z<5.4;  // 低缩放=全国概览,全挂
  for(const m of markers){
    let show=all;
    if(!all){
      if(m.el.style.display==="none")show=false;                         // 被筛选隐藏的直接卸载
      else{const p=map.project(m.u.ll);
        show=(p.x>=-CULL_PAD&&p.x<=W+CULL_PAD&&p.y>=-CULL_PAD&&p.y<=H+CULL_PAD)||(recMode&&!!m.u.rec);}
    }
    if(show&&!m.mounted){m.mk.addTo(map);m.mounted=true;}
    else if(!show&&m.mounted){m.mk.remove();m.mounted=false;}
  }
}
// 本科名称标签:放大到省/市级时,视野内的本科点阵浮出校名(碰撞去重叠 + 数量上限 + 增量更新防闪)。
// 仅"全部院校"态显示(筛选态点阵本身即子集);用 DOTS 的 rank 决定挤占时谁优先。

const hap=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};   // 移动端轻触感
function flyToProvince(prov){
  const pts=UNIS.concat(DOTS).filter(u=>u.p===prov&&u.ll&&u.ll[0]).map(u=>u.ll);
  if(!pts.length){flyHome(900);return;}
  let mnx=180,mny=90,mxx=-180,mxy=-90;
  for(const[x,y]of pts){if(x<mnx)mnx=x;if(y<mny)mny=y;if(x>mxx)mxx=x;if(y>mxy)mxy=y;}
  map.fitBounds([[mnx,mny],[mxx,mxy]],{padding:{top:120,bottom:130,left:70,right:70},maxZoom:8.5,duration:1100,pitch:globeOn?0:37});
}

let syncRegionUI=()=>{};                                     // initRegionMenu 内赋真身;applyRegion 调用同步显示
function initRegionMenu(provs){
  const dd=document.getElementById("region-dd"),btn=document.getElementById("region-trigger"),
        pop=document.getElementById("region-pop"),lab=document.getElementById("region-label");
  if(!dd||!btn||!pop)return;
  const opts=[""].concat(provs);
  pop.innerHTML=opts.map((p,i)=>`<div class="region-opt${i?"":" rg-all"}" id="rgo-${i}" role="option" data-v="${p}" aria-selected="${i?"false":"true"}">${p||"全国"}</div>`).join("");
  const items=[...pop.querySelectorAll(".region-opt")];
  let active=-1,outside=null;
  const setActive=i=>{active=Math.max(0,Math.min(items.length-1,i));
    items.forEach((el,k)=>el.classList.toggle("active",k===active));
    if(items[active]){items[active].scrollIntoView({block:"nearest"});pop.setAttribute("aria-activedescendant",items[active].id);}};
  syncRegionUI=v=>{v=v||"";if(lab)lab.textContent=v||"全国";
    items.forEach(el=>el.setAttribute("aria-selected",el.dataset.v===v?"true":"false"));};
  const close=()=>{if(pop.hidden)return;pop.hidden=true;btn.setAttribute("aria-expanded","false");
    items.forEach(el=>el.classList.remove("active"));pop.removeAttribute("aria-activedescendant");
    if(outside){document.removeEventListener("pointerdown",outside,true);outside=null;}};
  const open=()=>{if(!pop.hidden)return;pop.hidden=false;btn.setAttribute("aria-expanded","true");hap();
    setActive(Math.max(0,items.findIndex(el=>el.getAttribute("aria-selected")==="true")));
    pop.focus({preventScroll:true});
    outside=e=>{if(!dd.contains(e.target))close();};
    setTimeout(()=>document.addEventListener("pointerdown",outside,true),0);};
  const pick=v=>{syncRegionUI(v);close();btn.focus();applyRegion(v||"");};
  items.forEach(el=>el.addEventListener("click",()=>pick(el.dataset.v)));
  btn.addEventListener("click",()=>pop.hidden?open():close());
  btn.addEventListener("keydown",e=>{if(["ArrowDown","ArrowUp","Enter"," "].includes(e.key)){e.preventDefault();open();}});
  pop.addEventListener("keydown",e=>{
    if(e.key==="Escape"){e.preventDefault();close();btn.focus();}
    else if(e.key==="ArrowDown"){e.preventDefault();setActive(active+1);}
    else if(e.key==="ArrowUp"){e.preventDefault();setActive(active-1);}
    else if(e.key==="Home"){e.preventDefault();setActive(0);}
    else if(e.key==="End"){e.preventDefault();setActive(items.length-1);}
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(items[active])pick(items[active].dataset.v);}});
}
function applyRegion(prov){
  provFilter=prov||null; hap();
  syncRegionUI(provFilter||"");                              // 同步自绘下拉的显示+勾选
  const rp=document.getElementById("rp-prov");
  if(provFilter&&rp&&[...rp.options].some(o=>o.value===provFilter))rp.value=provFilter;   // 同步「我的推荐」省份
  applyFilter(curFilter);                                    // 叠加省份+层次重算可见
  if(provFilter)flyToProvince(provFilter);else flyHome(900);
}
const ULABEL_Z=7.3,ULABEL_CAP=48;
function updateUniLabels(){
  const z=map.getZoom(),want=new Map();
  if(z>=ULABEL_Z&&curFilter==="all"){
    const W=innerWidth,H=innerHeight,PAD=40,cx=W/2,cy=H/2,R=Math.min(W,H)*.46,inview=[];
    for(const u of DOTS){if(!u.ll||!u.ll[0])continue;
      const p=map.project(u.ll);if(p.x<-PAD||p.x>W+PAD||p.y<-PAD||p.y>H+PAD)continue;
      if(Math.hypot(p.x-cx,p.y-cy)>R)continue;                  // 只标注视野中心焦点区(当前区域),边缘只留点阵,免全图 messy
      inview.push({u,p});}
    inview.sort((a,b)=>(a.u.rank||99999)-(b.u.rank||99999));     // 名校优先挤位
    const placed=[];
    for(const m of markers){                                     // 先占位双一流旗子,本科标签避开它们
      if(!m.mounted||!m.u.ll||!m.el.classList.contains("show-flag"))continue;
      const fp=map.project(m.u.ll),o=m.mk.getOffset(),bh=[...String(m.u.s)].length*13+16;
      placed.push({x:fp.x-9+o.x,y:fp.y-bh+o.y,w:18,h:bh});
    }
    for(const it of inview){if(want.size>=ULABEL_CAP)break;
      const nm=it.u.n,w=[...nm].length*11+16,h=16,x=it.p.x-w/2,y=it.p.y-h-5;
      if(placed.some(q=>x<q.x+q.w+4&&x+w+4>q.x&&y<q.y+q.h+4&&y+h+4>q.y))continue;  // 叠压则跳过
      placed.push({x,y,w,h});want.set(nm,it.u);}
  }
  for(const[k,mk]of uniLabels)if(!want.has(k)){mk.remove();uniLabels.delete(k);}   // 移除离场
  for(const[k,u]of want)if(!uniLabels.has(k)){                                      // 新增入场
    const el=document.createElement("div");el.className="ulabel";el.textContent=u.n;
    el.addEventListener("click",e=>{e.stopPropagation();showCard(u);focusSchool(u.ll);});
    uniLabels.set(k,new maplibregl.Marker({element:el,anchor:"bottom",offset:[0,-4]}).setLngLat(u.ll).addTo(map));}
}
// 防叠压只在运动停止后跑一次——jumpTo 每次都会同步触发 moveend,旋转时若每帧都重算+setOffset 会顿挫
let declutterTimer=0;
map.on("moveend",()=>{clearTimeout(declutterTimer);declutterTimer=setTimeout(()=>{cullMarkers();declutterFlags();updateUniLabels();injectBadges();},130);});
function lazyMarkers(list,key,mk){
  const on=list[0],data=window[key+"Data"];
  if(!data)return;
  if(on&&!window[key+"Mks"]){
    window[key+"Mks"]=data.map(d=>mk(d).addTo(map));
  }else if(!on&&window[key+"Mks"]){
    window[key+"Mks"].forEach(m=>m.remove());window[key+"Mks"]=null;
  }
}
function updateFlags(){
  const z=map.getZoom();
  document.body.classList.toggle("z-mid",z>=4.8);
  document.body.classList.toggle("z-city",z>=8.2);
  document.body.style.setProperty("--ds",Math.max(.45,Math.min(1,(z-3)/3.5)).toFixed(3));  // 地标随缩放等比缩

  lazyMarkers([z>=4.6],"_city",([nm,lng,lat])=>{
    const el=document.createElement("div");el.className="city";
    el.innerHTML=`<i></i><span>${nm}</span>`;
    return new maplibregl.Marker({element:el,anchor:"left"}).setLngLat([lng,lat]);
  });
  lazyMarkers([z>=8.0],"_dist",([nm,c])=>{
    const el=document.createElement("div");el.className="dlabel";
    el.innerHTML=`<span>${nm}</span>`;
    return new maplibregl.Marker({element:el}).setLngLat(c);
  });
  const recMode=document.body.classList.contains("rec-mode");
  markers.forEach(({u,el})=>el.classList.toggle("show-flag",z>=5||!!u.top||(!!u.rec&&recMode&&z>=4)));  // 推荐旗 z<4 收成点

function drawRankChart(data,userScore){
  const W=680,H=360,mL=46,mR=14,mT=16,mB=26,iw=W-mL-mR,ih=H-mT-mB;
  const ys=(data.years||[]).filter(y=>y.pts&&y.pts.length);
  if(!ys.length)return '<p class="dim" style="padding:24px 0;text-align:center">该省 / 科类暂无一分一段数据</p>';
  let smin=1e9,smax=-1e9,rmax=0;
  ys.forEach(y=>y.pts.forEach(p=>{if(p[0]<smin)smin=p[0];if(p[0]>smax)smax=p[0];if(p[1]>rmax)rmax=p[1];}));
  const X=s=>mL+(s-smin)/((smax-smin)||1)*iw,Y=r=>mT+(r/(rmax||1))*ih;
  const pal=['#9c2f1b','#c08a2a','#6f8f6a','#7d7fb0','#b06a8a','#4f8d99'];
  let g='';
  for(let i=0;i<=4;i++){const r=rmax*i/4,y=Y(r);
    g+=`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}" stroke="#d8c8a4" stroke-dasharray="3 3"/>`;
    g+=`<text x="${mL-5}" y="${(y+3).toFixed(1)}" font-size="10" fill="#8a7350" text-anchor="end">${fmtRank(r)}</text>`;}
  for(let s=Math.ceil(smin/50)*50;s<=smax;s+=50)g+=`<text x="${X(s).toFixed(1)}" y="${H-7}" font-size="10" fill="#8a7350" text-anchor="middle">${s}</text>`;
  let lines='',leg=[],col={};
  ys.forEach((y,i)=>{const c=pal[i%pal.length];col[y.year]=c;
    const d=y.pts.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    lines+=`<polyline points="${d}" fill="none" stroke="${c}" stroke-width="${i===0?2.4:1.5}" stroke-linejoin="round" opacity="${i===0?1:.78}"/>`;
    leg.push(`<span><i style="background:${c}"></i>${y.year}</span>`);});
  let mk='';
  if(userScore&&userScore>=smin&&userScore<=smax){const x=X(userScore);
    mk+=`<line x1="${x.toFixed(1)}" y1="${mT}" x2="${x.toFixed(1)}" y2="${H-mB}" stroke="#3f3220" stroke-dasharray="4 3"/>`;
    mk+=`<text x="${x.toFixed(1)}" y="${(mT+9).toFixed(1)}" font-size="10" fill="#3f3220" text-anchor="middle">${userScore}分</text>`;
    ys.forEach(y=>{const r=rankAt(y.pts,userScore);if(r)mk+=`<circle cx="${x.toFixed(1)}" cy="${Y(r).toFixed(1)}" r="3.2" fill="${col[y.year]}"/>`;});}
  document.getElementById("viz-legend").innerHTML=leg.join('')+'<span class="dim">越靠右上=同分位次越好</span>';
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}${lines}${mk}</svg>`;
}

// 学科评估 head-to-head:两校共同评估的学科,等级并排上色,▲ 标更强;按最高档排序
function cmpEvalRows(ds,span){
  const maps=ds.map(u=>{const m={};(u.eval||[]).forEach(e=>m[e.discipline]=e.grade);return m;});
  let disc=[...new Set(maps.flatMap(m=>Object.keys(m)))].filter(d=>maps.filter(m=>m[d]).length>=2);
  const diff=CMPV.onlyDiff;
  if(diff)disc=disc.filter(d=>{const vs=maps.map(m=>m[d]||'');return !vs.every(v=>v===vs[0]);});   // 只看不同:剔除两校同级的学科
  let h=`<tr class="cmp-sec-row"><td colspan="${span}">学科评估对比 · 第四轮${disc.length?` <span>(${disc.length} 个${diff?'有差异':'共同'}学科 · ▲ 更强)</span>`:''}</td></tr>`;
  if(!disc.length)return h+`<tr><td colspan="${span}" class="cmp-note">${diff?'两校共同学科评级一致(无差异)':'两校无共同评估学科 · 各自优势见学校卡片'}</td></tr>`;
  const bestV=d=>Math.max(...maps.map(m=>GRADE_V[m[d]]||0));
  disc.sort((a,b)=>bestV(b)-bestV(a)||a.localeCompare(b,'zh'));
  const CAP=20,show=disc.slice(0,CAP);
  for(const d of show){const bv=bestV(d),tie=maps.filter(m=>(GRADE_V[m[d]]||0)===bv).length>1;
    h+=`<tr><td class="cl">${d}</td>`+maps.map(m=>{const g=m[d],lead=g&&GRADE_V[g]===bv&&!tie;
      return `<td>${g?`<b style="color:${GRADE_C[g]}">${g}</b>`:'<span class="dim">—</span>'}${lead?' <span class="lead">▲</span>':''}</td>`;}).join('')+'</tr>';}
  if(disc.length>CAP)h+=`<tr><td colspan="${span}" class="cmp-note">…另有 ${disc.length-CAP} 个共同学科(评分较弱)略</td></tr>`;
  return h;
}
// 同专业录取位次 head-to-head:两校同名专业(归一化匹配)的本省位次并排,▲ 标更高(位次更小)
function cmpMajorRows(ds,prov,span){
  const norm=s=>String(s).replace(/[（(].*?[)）]|[\s·・、类]/g,'');
  const maps=ds.map(u=>{const m={};(u.lines||[]).filter(l=>l.granularity==='major'&&l.min_rank).forEach(l=>{const k=norm(l.major);if(k&&(!m[k]||l.min_rank<m[k].r))m[k]={n:l.major,r:l.min_rank};});return m;});
  let keys=[...new Set(maps.flatMap(m=>Object.keys(m)))].filter(k=>maps.filter(m=>m[k]).length>=2);
  if(CMPV.onlyDiff)keys=keys.filter(k=>{const vs=maps.map(m=>m[k]?m[k].r:null);return !vs.every(v=>v===vs[0]);});
  let h=`<tr class="cmp-sec-row"><td colspan="${span}">同专业录取位次 · ${prov}${keys.length?` <span>(越小越难进 · ▲ 更高)</span>`:''}</td></tr>`;
  if(!keys.length)return h+`<tr><td colspan="${span}" class="cmp-note">${CMPV.onlyDiff?'两校同名专业位次无差异':'两校无同名专业可对位 · 见上方位次区间'}</td></tr>`;
  const bestR=k=>Math.min(...maps.map(m=>m[k]?m[k].r:1/0));
  keys.sort((a,b)=>bestR(a)-bestR(b));
  const CAP=14,show=keys.slice(0,CAP);
  for(const k of show){const br=bestR(k),tie=maps.filter(m=>m[k]&&m[k].r===br).length>1,lab=(maps.find(m=>m[k])||{})[k].n;
    h+=`<tr><td class="cl" title="${lab}">${lab}</td>`+maps.map(m=>{const lead=m[k]&&m[k].r===br&&!tie;
      return `<td>${m[k]?m[k].r.toLocaleString():'<span class="dim">—</span>'}${lead?' <span class="lead" style="color:#1d9e75">▲</span>':''}</td>`;}).join('')+'</tr>';}
  if(keys.length>CAP)h+=`<tr><td colspan="${span}" class="cmp-note">…另有 ${keys.length-CAP} 个同名专业略</td></tr>`;
  return h;
}

function updateRecFlagZoom(z){      // 推荐旗低缩放收成圆点+偏移归零(rec 点已按冲稳保上色),免低缩放扇形把沿海校甩进海

// 叠压点选消解:鼠标移动时把光标附近(72px)的可见旗按到光标的距离排前后——最近的 z 最高浮到最上且可点,

let _fzRAF=0,_fzXY=null,_fzRaised=[];

  if(recMode==="rank"){if(!Number.isFinite(n)||n<1){st.textContent="请输入有效位次(正整数)";return;}}

    document.querySelectorAll(".rec-fav").forEach(b=>b.classList.toggle("on",favHas(b.dataset.k)));};
  if(!FAV.length){list.innerHTML='<p class="sr-empty">还没有收藏。点学校卡片★、推荐结果、或选校助手「＋加入志愿表」即可。</p>';syncBtns();return;}
  const c={"冲":0,"稳":0,"保":0};FAV.forEach(x=>{if(c[x.band]!==undefined)c[x.band]++;});
  const banded=c.冲+c.稳+c.保;
  let html='';
  if(banded){let cls='ok',msg=`✓ 冲 ${c.冲} · 稳 ${c.稳} · 保 ${c.保},梯度合理`;
    if(!c.保){cls='warn';msg='⚠ 没有"保"底——有滑档风险,建议加 1-2 个保底专业';}
    else if(c.冲&&!c.稳){cls='warn';msg='⚠ 缺"稳"档,梯度断层,建议补几个匹配专业';}
    html+=`<div class="fav-risk ${cls}">${msg}</div>`;}
  [["冲","冲一冲(争取)"],["稳","稳一稳(匹配)"],["保","保一保(兜底)"],["","其他收藏"]].forEach(([band,lab])=>{
    const its=FAV.map((it,i)=>({it,i})).filter(x=>(x.it.band||"")===band);
    if(!its.length)return;
    if(band||banded)html+=`<div class="fav-grp">${band?`<span class="rb ${band}">${band}</span> `:''}${lab} · ${its.length}</div>`;
    its.forEach(({it,i})=>{html+=`<div class="fav-row" draggable="true" data-i="${i}">
      ${badge(it.n,26)}
      <div class="fav-meta"><span class="fav-nm">${it.n}</span>${it.major?`<span class="fav-mj">${it.major}</span>`:""}</div>
      <span class="sr-badge t${it.t||"ben"}">${tierZh(it.t)}</span>
      <span class="fav-x" data-i="${i}">✕</span></div>`;});
  });
  list.innerHTML=html;
  list.querySelectorAll(".fav-row").forEach(r=>{
    r.addEventListener("click",e=>{if(e.target.classList.contains("fav-x"))return;
      const it=FAV[+r.dataset.i],ll=it.ll||llOf(it.n);userTouched=true;
      if(ll&&ll[0])map.flyTo({center:ll,zoom:9,pitch:45,duration:1800,curve:1.42});showUniCard(it.n);});
    r.addEventListener("dragstart",()=>{favDragI=+r.dataset.i;r.classList.add("dragging");});
    r.addEventListener("dragend",()=>r.classList.remove("dragging"));
    r.addEventListener("dragover",e=>e.preventDefault());
    r.addEventListener("drop",e=>{e.preventDefault();const ti=+r.dataset.i;
      if(favDragI==null||favDragI===ti)return;const [mv]=FAV.splice(favDragI,1);FAV.splice(ti,0,mv);favSave();});
  });
  list.querySelectorAll(".fav-x").forEach(x=>x.addEventListener("click",e=>{
    e.stopPropagation();FAV.splice(+x.dataset.i,1);favSave();}));
  syncBtns();
}
window.cardFavClick=function(btn){try{favToggle(JSON.parse(btn.dataset.it.replace(/&#39;/g,"'")));}catch(e){}};
function cardFavHTML(it){const k=favKey(it),on=favHas(k);
  return `<button class="card-fav${on?" on":""}" data-k="${k}" data-it='${JSON.stringify(it).replace(/'/g,"&#39;")}' onclick="cardFavClick(this)">${on?"★ 已收藏":"☆ 收藏"}</button>`;}
(function(){
  const btn=document.getElementById("favbtn"),panel=document.getElementById("favpanel");
  btn.addEventListener("click",e=>{e.stopPropagation();panel.style.display=panel.style.display==="block"?"none":"block";});
  document.addEventListener("click",e=>{if(!panel.contains(e.target)&&e.target!==btn)panel.style.display="none";});
  document.getElementById("fav-clear").addEventListener("click",()=>{if(FAV.length&&confirm("清空志愿表?")){FAV=[];favSave();}});
  document.getElementById("fav-export").addEventListener("click",()=>{
    if(!FAV.length){toast("志愿表是空的");return;}
    const out=["【我的高考志愿表】"];
    [["冲","■ 冲一冲"],["稳","■ 稳一稳"],["保","■ 保一保"],["","■ 其他"]].forEach(([b,lab])=>{
      const its=FAV.filter(x=>(x.band||"")===b);if(!its.length)return;
      out.push("",lab);its.forEach((it,i)=>out.push(`  ${i+1}. ${it.n}${it.major?" · "+it.major:""}`));});
    navigator.clipboard.writeText(out.join("\n")).then(()=>toast("已复制 "+FAV.length+" 条到剪贴板"),()=>toast("复制失败,请手动选择"));
  });
  favRender();
})();
// 移动端 ⚙ 设置菜单开合
(function(){
  const cb=document.getElementById("cfgbtn");
  cb.addEventListener("click",e=>{e.stopPropagation();document.body.classList.toggle("cfg-open");});
  map.getCanvas().addEventListener("pointerdown",()=>document.body.classList.remove("cfg-open"));
})();
document.getElementById("t3dbtn").addEventListener("click",()=>{
  userTouched=true;terrain3D=!terrain3D;
  const tb=document.getElementById("t3dbtn");tb.classList.toggle("on",terrain3D);
  tb.title=terrain3D?"地形:立体 3D — 静止欣赏更佳,旋转会偏卡;点按回平面":"地形:平面(超流畅)— 点按切换立体 3D";
  if(terrain3D)map.setTerrain({source:"dem",exaggeration:STYLES[styleMode].terrainEx});
  else{_loQ=false;clearTimeout(_hiTimer);map.setTerrain(null);}
});
document.getElementById("stylebtn").addEventListener("click",()=>{
  userTouched=true;
  styleMode=styleMode==="wc"?"sym":"wc";
  applyStyle();
});
tourbtn.addEventListener("click",()=>{
  userTouched=true;
  if(touring){stopTour();return;}
  touring=true;tourbtn.textContent="停 止 巡 游";
  let i=0;
  const step=()=>{
    if(!touring)return;
    if(i>=RECS.length){
      flyHome(2600);
      stopTour();card.style.display="none";return;
    }
    const u=RECS[i];
    if(u.ll&&u.ll[0])map.flyTo({center:u.ll,zoom:7,pitch:63,bearing:i%2?18:-18,duration:2800,curve:1.42,essential:true});
    showUniCard(u.n);
    i++;tourTimer=setTimeout(step,4200);
  };
  step();
});
map.on("click",e=>{if(e.originalEvent&&e.originalEvent._uniHit)return;card.style.display="none";});
</script>
